      <defs>
        <pattern id="cautionStripes" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <rect width="14" height="14" fill="var(--accent)"/>
          <rect width="7" height="14" fill="#ffffff"/>

      <!-- ground, drawn first so the cone's base can cover it -->
      <line x1="15" y1="160" x2="285" y2="160" stroke="var(--ground)" stroke-width="3"/>
      <path d="M20 160 Q22 154 24 160 M25 160 Q27 152 29 160 M30 160 Q32 155 34 160" stroke="var(--ground)" stroke-width="1.6" fill="none" stroke-linecap="round"/>

      <rect x="264" y="100" width="6" height="48" rx="2" fill="var(--accent)"/>

      <rect x="25" y="97" width="250" height="16" rx="2" fill="url(#cautionStripes)" stroke="var(--accent)" stroke-width="2" transform="rotate(-3 150 105)"/>

      <!-- cone, drawn last so its base covers the ground line beneath it -->
      <path d="M145,58 L155,58 Q160,58 161.28,62.83 L184.72,151.17 Q186,156 181,156 L119,156 Q114,156 115.28,151.17 L138.72,62.83 Q140,58 145,58 Z" fill="var(--accent)" stroke="var(--accent-outline)" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="131.51,90 168.49,90 172.2,104 127.8,104" fill="#ffffff"/>
      <polygon points="123.02,122 176.98,122 180.69,136 119.31,136" fill="#ffffff"/>
      <rect x="108" y="156" width="84" height="10" rx="3" fill="var(--accent)" stroke="var(--accent-outline)" stroke-width="2"/>
    </svg>

    <div class="heading-group">

    <p class="note">Individual services on their usual subdomains function as normal.</p>
